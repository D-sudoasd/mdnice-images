<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">mdnice-images</title>
  <desc id="desc">Image hosting repository for mdnice and WeChat copy-ready Markdown columns.</desc>
  <rect width="1200" height="300" rx="28" fill="#111827"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="56" y="80" fill="#f472b6" font-size="18" font-weight="700" letter-spacing="2">ASSET HOST · MDNICE / WECHAT</text>
    <text x="56" y="140" fill="#f8fafc" font-size="48" font-weight="800">mdnice-images</text>
    <text x="56" y="190" fill="#94a3b8" font-size="22">Stable image URLs for Markdown columns and covers.</text>
    <text x="56" y="240" fill="#64748b" font-size="18">Not an app — a public asset tree for copy-ready posts</text>
  </g>
  <g transform="translate(820 70)">
    <rect width="100" height="70" rx="10" fill="#1f2937" stroke="#f472b6"/>
    <rect x="40" y="40" width="100" height="70" rx="10" fill="#1f2937" stroke="#38bdf8"/>
    <rect x="80" y="80" width="100" height="70" rx="10" fill="#1f2937" stroke="#a7f3d0"/>
  </g>
</svg>
